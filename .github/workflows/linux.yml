name: GNU/Linux Build

# Controls when the action will run. Triggers the workflow on push or
# pull request events but only for the master branch
on: [push, pull_request]

env:
  PYKCS11LIB: /usr/lib/softhsm/libsofthsm2.so

# A workflow run is made up of one or more jobs that can run
# sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    # Steps represent a sequence of tasks that will be executed as part of
    # the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job
      # can access it
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: setup prerequisites (linux)
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y softhsm2 swig
          python -m pip install --upgrade pip
          pip install tox

      - name: Build
        run: |
          python -m venv temp
          source temp/bin/activate
          pip install -r dev-requirements.txt
          make

      - name: Test
        shell: bash
        run: |
          sudo chmod -R a+rx /etc/softhsm
          sudo chmod a+r /etc/softhsm/softhsm2.conf
          sudo chown -R "$(whoami)" /var/lib/softhsm
          softhsm2-util --init-token --slot 0 --label "A token" --pin 1234 --so-pin 123456
          source temp/bin/activate
          make install
          make test

      - name: pylint
        run: |
          source temp/bin/activate
          make pylint

      - name: tox
        shell: bash
        run: |
          ./get_PYKCS11LIB.py > tox.env
          TOX_ENV="py$(echo ${{ matrix.python-version }} | tr -d '.')"
          tox -e "$TOX_ENV"

      - name: coverage
        shell: bash
        run: |
          source temp/bin/activate
          coverage erase
          coverage run -m unittest discover
          coverage report

      - name: Covealls
        uses: AndreMiras/coveralls-python-action@develop
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build_wheels:
    name: Build wheels on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-linux
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: "PyPI Publish"
    needs: ["build", "build_wheels", "build_sdist"]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: "ubuntu-latest"
    environment:
      name: pypi
      url: https://pypi.org/p/pykcs11
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1

      - name: move wheels and sdist to dist/
        run: |
          mkdir -v dist
          mv -v cibw-wheels-linux/*.whl dist/
          mv -v cibw-sdist/*.tar.gz dist/
          ls -al dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
